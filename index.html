<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>N63CB 360 Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      touch-action: none;
    }
    #N63CB {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100%;
      position: relative;
      overflow: hidden;
      background: #fff;
    }
  </style>
  <script src="viewer/files/360rot.js"></script>
  <script>
    var keyshotXR;
    function initKeyShotXR() {
      var nameOfDiv = "N63CB";
      var folderName = "viewer";
      var viewPortWidth = Math.max(320, window.innerWidth || 1250);
      var viewPortHeight = Math.max(320, window.innerHeight || 1250);
      var backgroundColor = "#FFFFFF";
      var uCount = 30;
      var vCount = 3;
      var uWrap = true;
      var vWrap = false;
      var uMouseSensitivity = -0.0833333;
      var vMouseSensitivity = 0.0315789;
      var uStartIndex = 15;
      var vStartIndex = 1;
      var minZoom = 1;
      var maxZoom = 2;
      var rotationDamping = 0.96;
      var downScaleToBrowser = true;
      var addDownScaleGUIButton = false;
      var downloadOnInteraction = true;
      var imageExtension = "jpg";
      var showLoading = true;
      var loadingIcon = "Loading.png";
      var allowFullscreen = true;
      var uReverse = false;
      var vReverse = false;
      var hotspots = {};
      var isIBooksWidget = false;

      keyshotXR = new keyshotXR(
        nameOfDiv, folderName, viewPortWidth, viewPortHeight, backgroundColor,
        uCount, vCount, uWrap, vWrap, uMouseSensitivity, vMouseSensitivity,
        uStartIndex, vStartIndex, minZoom, maxZoom, rotationDamping,
        downScaleToBrowser, addDownScaleGUIButton, downloadOnInteraction,
        imageExtension, showLoading, loadingIcon, allowFullscreen,
        uReverse, vReverse, hotspots, isIBooksWidget
      );
    }
    window.addEventListener('load', initKeyShotXR, { once: true });
  </script>
</head>
<body oncontextmenu="return false;">
  <div id="N63CB" aria-label="Interactive 360 degree view of aircraft exterior"></div>
</body>
</html>
